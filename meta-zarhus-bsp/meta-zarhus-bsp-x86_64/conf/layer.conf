BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "zarhus-bsp-x86_64"
BBFILE_PATTERN_zarhus-bsp-x86_64 = "^${LAYERDIR}/"
BBFILE_PRIORITY_zarhus-bsp-rockchip = "5"

LAYERSERIES_COMPAT_zarhus-bsp-x86_64 = "scarthgap"
