---
header:
  version: 11

distro: zarhus-distro
target:
  - zarhus-base-image

repos:
  meta-zarhus:
    layers:
      meta-zarhus-distro:
      meta-zarhus-bsp/meta-zarhus-bsp-common:

  poky:
    url: https://git.yoctoproject.org/git/poky
    refspec: 7dad83c7e5e9637c0ff5d5712409611fd4a14946
    layers:
      meta:
      meta-poky:
      meta-yocto-bsp:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    refspec: 6c9f1f8d4538119803bf793747b65e4d23c33544
    layers:
      meta-oe:
      meta-networking:
      meta-python:
      meta-multimedia:

bblayers_conf_header:
  standard: |
    POKY_BBLAYERS_CONF_VERSION = "2"
    BBPATH = "${TOPDIR}"
    BBFILES ?= ""
local_conf_header:
  standard: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_rpm"
    SDKMACHINE = "x86_64"
  diskmon: |
    BB_DISKMON_DIRS = "\
        STOPTASKS,${TMPDIR},1G,100K \
        STOPTASKS,${DL_DIR},1G,100K \
        STOPTASKS,${SSTATE_DIR},1G,100K \
        STOPTASKS,/tmp,100M,100K \
        HALT,${TMPDIR},100M,1K \
        HALT,${DL_DIR},100M,1K \
        HALT,${SSTATE_DIR},100M,1K \
        HALT,/tmp,10M,1K"
