section()
{
    local text=$1
    local color=${2:-yellow}
	cukinia_log "$(_colorize "$color" "----> $text <----")"
}

# use 'command id' due to https://github.com/savoirfairelinux/cukinia/issues/83
if ! as "Check if cukinia is run with root privileges" cukinia_test "$(command id -u)" -eq 0; then
    cukinia_log "$(_colorize red '!! Make sure to run cukinia as sudo/root !!')"
fi

if compgen -G "/etc/cukinia/conf.d/*.conf" >/dev/null; then
    cukinia_conf_include /etc/cukinia/conf.d/*.conf
fi
cukinia_log "result: $cukinia_failures failure(s)"
